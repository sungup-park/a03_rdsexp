<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사원 정보 조회</title>
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Noto Sans KR', sans-serif;
        }
        body {
            background-color: #f4f6f9;
            padding: 30px;
            margin: 0;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h2 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #4A90E2;
            padding-bottom: 10px;
        }
        .search-box {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background: #eef2f7;
            padding: 15px;
            border-radius: 8px;
            align-items: center;
        }
        .input-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-group label {
            font-weight: bold;
            font-size: 14px;
            color: #555;
        }
        .input-group input, .input-group select {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }
        .btn-search {
            background-color: #4A90E2;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-search:hover {
            background-color: #357ABD;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #e0e0e0;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #f8f9fa;
            color: #495057;
        }
        tr:nth-child(even) {
            background-color: #fafafa;
        }
        .no-data {
            padding: 30px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>사원 정보 검색</h2>

    <!-- 검색 조건 영역 -->
    <div class="search-box">
        <div class="input-group">
            <label for="ename">사원명:</label>
            <input type="text" id="ename" placeholder="사원명 입력 (예: SMITH)">
        </div>
        <div class="input-group">
            <label for="job">직책명:</label>
            <select id="job">
                <option value="">전체 직책</option>
                <option value="CLERK">CLERK</option>
                <option value="SALESMAN">SALESMAN</option>
                <option value="MANAGER">MANAGER</option>
                <option value="ANALYST">ANALYST</option>
                <option value="PRESIDENT">PRESIDENT</option>
            </select>
        </div>
        <button type="button" class="btn-search" id="btnSearch">조회</button>
    </div>

    <!-- 결과 테이블 -->
    <table>
        <thead>
            <tr>
                <th>사원번호</th>
                <th>사원명</th>
                <th>직책</th>
                <th>급여</th>
            </tr>
        </thead>
        <tbody id="empTableBody">
            <!-- AJAX 결과 데이터가 출력되는 영역 -->
        </tbody>
    </table>
</div>

<script>
    $(document.body).ready(function() {
        // 초기 화면 로드시 전체 사원 목록 조회
        loadEmpList();

        // 조회 버튼 클릭 이벤트
        $('#btnSearch').on('click', function() {
            loadEmpList();
        });

        // 사원명 입력창에서 Enter 키 누를 시 검색
        $('#ename').on('keyup', function(e) {
            if (e.key === 'Enter') {
                loadEmpList();
            }
        });

        // 직책 선택 변경 시 자동 검색
        $('#job').on('change', function() {
            loadEmpList();
        });
    });

    // AJAX 사원 목록 조회 함수
    function loadEmpList() {
        const ename = $('#ename').val().trim();
        const job = $('#job').val();

        $.ajax({
            url: '/api/emps',
            type: 'GET',
            data: {
                ename: ename,
                job: job
            },
            dataType: 'json',
            success: function(response) {
                const tbody = $('#empTableBody');
                tbody.empty(); // 기존 데이터 초기화

                if (!response || response.length === 0) {
                    tbody.append('<tr><td colspan="4" class="no-data">조회된 사원 정보가 없습니다.</td></tr>');
                    return;
                }

                // 테이블 행 생성
                let rows = '';
                $.each(response, function(index, emp) {
                    rows += `
                        <tr>
                            <td>${emp.empno}</td>
                            <td>${emp.ename}</td>
                            <td>${emp.job}</td>
                            <td>$${Number(emp.sal).toLocaleString()}</td>
                        </tr>
                    `;
                });
                tbody.append(rows);
            },
            error: function(xhr, status, error) {
                console.error("데이터 조회 실패:", error);
                alert("사원 정보를 불러오는 중 오류가 발생했습니다.");
            }
        });
    }
</script>

</body>
</html>
